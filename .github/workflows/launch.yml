name: Flagship polish

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/launch.yml'
      - 'scripts/render-demo.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install demo renderer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render README demo
        run: python scripts/render-demo.py

      - name: Commit demo GIF if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/demo.gif
          if ! git diff --cached --quiet; then
            git commit -m "docs: render context-find demo"
            git push
          fi

      - name: Add repository topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/topics \
            -f 'names[]=claude-code' \
            -f 'names[]=codex' \
            -f 'names[]=developer-tools' \
            -f 'names[]=terminal' \
            -f 'names[]=cli' \
            -f 'names[]=typescript' \
            -f 'names[]=tui' \
            -f 'names[]=search' \
            -f 'names[]=ai-coding' \
            -f 'names[]=productivity' || echo 'Topic update was not permitted by this repository token; set the same topics manually.'

      - name: Create v0.1.0 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists'
          else
            gh release create v0.1.0 \
              --target main \
              --title 'context-find v0.1.0' \
              --notes $'First public flagship release of context-find.\n\nHighlights:\n- Search Claude Code and Codex conversations together\n- Resume sessions from any project directory\n- Search other machines over SSH without installing an agent\n- No transcript index, daemon, or cloud copy\n- Interactive reader and machine browser'
          fi
